services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: mcp
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - LINSHARE_MCP_MODE=all
    restart: unless-stopped

  chat-assistant:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: chat
    ports:
      - "8090:8080"
    depends_on:
      - mcp-server
    env_file:
      - ../.env

    restart: unless-stopped
